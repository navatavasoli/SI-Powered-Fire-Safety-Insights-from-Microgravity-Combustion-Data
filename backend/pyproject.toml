[project]
name = "crassus-backend"
version = "0.1.0"
description = "CRASSUS API: cached NASA PSI combustion data + RAG copilot"
requires-python = ">=3.12"
# Runtime only — this is what Vercel installs into the function bundle (~70 MB).
# Embeddings come from the Gemini API (see rag/index.py), so no local model ships.
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "numpy>=1.26",
  "python-dotenv>=1.0",
  "truststore>=0.10",
]

[project.optional-dependencies]
# Local only: ingest from the live PSI API, run the server, run tests.
dev = ["requests>=2.31", "uvicorn[standard]>=0.29", "pytest>=8"]
# Optional offline embeddings: python -m rag.index --embedder local
local-embeddings = ["fastembed>=0.5"]
